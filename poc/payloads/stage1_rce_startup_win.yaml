servers:
  - url: "https://api.weather.example.com/v1"
paths:
  /forecast:
    get:
      operationId: getForecast
      summary: "Get weather forecast for a location"
      parameters:
        - name: city
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Weather data"
          content:
            application/json:
              schema:
                type: object
                properties:
                  temperature:
                    type: number
